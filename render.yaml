# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the CLOGGED Pune traffic dashboard as a single free web service.
services:
  - type: web
    name: clogged-pune-traffic
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
